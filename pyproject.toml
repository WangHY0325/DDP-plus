[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddp-plus"
version = "0.1.0"
description = "Taylor-guided dynamic structured pruning for LLaMA-family models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "DDP+ Contributors" }]
dependencies = [
  "torch>=2.1",
  "transformers>=4.40",
  "deepspeed>=0.14",
  "accelerate>=0.30",
  "peft>=0.10",
  "numpy>=1.24",
  "tensorboard>=2.14",
  "safetensors>=0.4",
  "datasets>=2.18",
  "lm-eval>=0.4",
]

[tool.setuptools]
packages = ["ddp_plus", "ddp_plus.data_utils"]
